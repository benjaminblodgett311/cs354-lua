<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reveal.js Minimal</title>

    <!-- Reveal.js core + theme from CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/black.css" id="theme">

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
</head>
<body>

    <div class="reveal">
        <div class="slides">
            <section>
                <h2>Hello</h2>
                <p>This is a minimal Reveal.js slide deck.</p>
            </section>

            <section>
                <h2>Second Slide</h2>
                <p>Arrow keys move between slides.</p>
            </section>

            <!-- Vertical slides example -->
            <section>
                <section>Vertical Slide 1</section>
                <section>Vertical Slide 2</section>
            </section>
        </div>
    </div>

    <script>
        Reveal.initialize();
    </script>

</body>
</html>
